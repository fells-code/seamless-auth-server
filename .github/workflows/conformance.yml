# Run the cross-repo conformance matrix on PRs, testing this repo's change against
# the rest of the ecosystem. The reusable workflow lives in seamless-cli.
name: conformance

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: fells-code/seamless-cli/.github/workflows/verify-conformance.yml@1ff9552d68d3d74096992a83d931acc0233edab2 # v0.26.0
    with:
      server-ref: ${{ github.event.pull_request.head.sha }}

  # The seamless-cli matrix above runs the Express and Fastify reference apps it
  # builds itself. Next.js has no reference app there, so this job runs the same
  # adapter specs against conformance/nextjs-refapp through --adapter-url, the
  # way the Go, Python and Rust adapters run them from their own repositories.
  nextjs:
    name: adapter conformance (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: seamless-auth-server

      # The same CLI the matrix above pins, so both run one version of the specs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fells-code/seamless-cli
          ref: 1ff9552d68d3d74096992a83d931acc0233edab2 # v0.26.0
          path: seamless-cli

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fells-code/seamless-auth-api
          path: seamless-auth-api

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: seamless-auth-server/.nvmrc
          cache: pnpm
          cache-dependency-path: seamless-auth-server/pnpm-lock.yaml

      - name: Build the CLI
        working-directory: seamless-cli
        run: npm ci && npm run build

      - name: Build the reference app
        working-directory: seamless-auth-server
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @seamless-auth/core build
          pnpm --filter @seamless-auth/nextjs build
          pnpm --filter seamless-nextjs-refapp build:refapp

      # Values from verify/CONFORMANCE.md in seamless-cli. The app runs on the
      # host and reaches the API through its published port, while the API signs
      # as its in-network ISSUER.
      - name: Start the reference app
        working-directory: seamless-auth-server/conformance/nextjs-refapp
        env:
          AUTH_SERVER_URL: http://localhost:5312
          AUTH_SERVER_ISSUER: http://auth-api:5312
          SEAMLESS_SERVICE_TOKEN: verify-dev-service-token-not-a-real-secret
          COOKIE_SIGNING_KEY: verify-dev-service-token-not-a-real-secret
          JWKS_KID: dev-main
        run: nohup pnpm start:refapp -p 3002 > refapp.log 2>&1 &

      - name: Conformance
        env:
          SEAMLESS_API_DIR: ${{ github.workspace }}/seamless-auth-api
        run: node seamless-cli/dist/index.js verify --adapter-url=http://localhost:3002

      - name: Reference app log
        if: always()
        run: cat seamless-auth-server/conformance/nextjs-refapp/refapp.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results-nextjs
          path: seamless-cli/verify/harness/results/
          if-no-files-found: ignore
