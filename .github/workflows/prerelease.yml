name: Prerelease

on:
  push:
    branches:
      - dev
      - "release/**"
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag to publish
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - rc

permissions:
  contents: read

# Serialized rather than cancelled, so a snapshot publish is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tests run without id-token: write, so code on the pushed branch never runs
  # next to the publish identity unless a reviewer approves the publish job.
  test:
    name: Test Prerelease Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.channel.outputs.tag }}
      has_changesets: ${{ steps.changesets.outputs.has_changesets }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Determine release channel
        id: channel
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_NAME" = "dev" ]; then
            TAG="beta"
          else
            TAG="rc"
          fi

          case "$TAG" in
            alpha|beta|rc) ;;
            *)
              echo "::error::Unsupported prerelease tag"
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check release intent
        id: changesets
        run: |
          node -e "const fs = require('fs'); const hasChangesets = fs.readdirSync('.changeset').some((name) => name.endsWith('.md') && name !== 'README.md'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'has_changesets=' + hasChangesets + '\n');"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workspace
        run: pnpm test

  publish:
    name: Publish Prerelease Snapshot
    needs: test
    if: needs.test.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protected environment: required reviewers approve every publish, and the
    # npm trusted publisher is bound to this environment name.
    environment: npm-prerelease

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish snapshot packages
        env:
          NPM_CONFIG_PROVENANCE: true
          TAG: ${{ needs.test.outputs.tag }}
        run: pnpm "release:$TAG"
